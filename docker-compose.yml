services:
  web:
    build: .
    container_name: nature_folio_web
    ports:
      - "8100:80"
    env_file:
      - .env
    environment:
      # Sessions PHP persistantes (survit aux rebuilds du conteneur en local)
      - PHP_SESSION_SAVE_PATH=/var/www/sessions
    volumes:
      # Les photos ne sont pas dans git : on monte les dossiers locaux
      - ./oiseaux/_photos:/var/www/html/oiseaux/_photos
      - ./lepido/_photos:/var/www/html/lepido/_photos
      # Sessions admin persistantes en local
      - ./_docker/sessions:/var/www/sessions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: nature_folio_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      - ./_docker/naturanim_dump.sql:/docker-entrypoint-initdb.d/naturanim_dump.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
